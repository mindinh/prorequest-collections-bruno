info:
  name: Get Metadata
  type: http
  seq: 3

http:
  method: GET
  url: "{{HOST}}{{SERVICE}}$metadata"
  headers:
    - name: x-csrf-token
      value: fetch
  auth:
    type: basic
    username: "{{sap_username}}"
    password: "{{sap_password}}"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
