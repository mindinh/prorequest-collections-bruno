info:
  name: Get Workflow Tasks
  type: http
  seq: 1

http:
  method: GET
  url: "{{HOST}}{{SERVICE}}CNMA_WFTASK?sap-client=300&sap-language=en&$orderby=TaskCreationDateTime desc"
  headers:
    - name: x-csrf-token
      value: fetch
  params:
    - name: sap-client
      value: "300"
      type: query
    - name: sap-language
      value: en
      type: query
    - name: $orderby
      value: TaskCreationDateTime desc
      type: query
    - name: $filter
      value: WorkflowTaskStatus eq 'IN PROCESSING'
      type: query
      disabled: true
    - name: $count
      value: "true"
      type: query
      disabled: true
    - name: )$apply
      value: |-
        $apply=groupby(
          (DocCategory),
          aggregate($count as TaskCount)
        )
      type: query
      disabled: true
  auth:
    type: basic
    username: "{{sap_username}}"
    password: "{{sap_password}}"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
