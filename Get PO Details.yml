info:
  name: Get PO Details
  type: http
  seq: 6

http:
  method: GET
  url: "{{HOST}}{{SERVICE}}CNMA_POHEADER(DocCategory='BUS2012',DocumentNumber='4300000225')?sap-client=300&sap-language=en&$expand=_HeaderText,_ApprovalStep,_Item,_Attachment"
  params:
    - name: sap-client
      value: "300"
      type: query
    - name: sap-language
      value: en
      type: query
    - name: $expand
      value: _HeaderText,_ApprovalStep,_Item,_Attachment
      type: query
  auth:
    type: basic
    username: "{{sap_username}}"
    password: "{{sap_password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
