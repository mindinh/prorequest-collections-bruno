info:
  name: Get All Users
  type: http
  seq: 13

http:
  method: GET
  url: "{{HOST}}{{SERVICE}}/CNMA_BUSUSER?sap-client=300&sap-language=en"
  params:
    - name: sap-client
      value: "300"
      type: query
    - name: sap-language
      value: en
      type: query
  auth:
    type: basic
    username: "{{sap_username}}"
    password: "{{sap_password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
