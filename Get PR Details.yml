info:
  name: Get PR Details
  type: http
  seq: 2

http:
  method: GET
  url: "{{HOST}}{{SERVICE}}CNMA_PRHEADER(DocCategory='BUS2105',DocumentNumber='1300000406')?sap-client=300&sap-language=en&$expand=_HeaderText,_ApprovalStep,_Comment,_Item,_Attachment,_PurposeText,_PaidByText,_BankDetails"
  params:
    - name: sap-client
      value: "300"
      type: query
    - name: sap-language
      value: en
      type: query
    - name: $expand
      value: _HeaderText,_ApprovalStep,_Comment,_Item,_Attachment,_PurposeText,_PaidByText,_BankDetails
      type: query
  auth:
    type: basic
    username: "{{sap_username}}"
    password: "{{sap_password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
